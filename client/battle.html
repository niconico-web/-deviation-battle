<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>School Battle - バトル</title>
<meta name="theme-color" content="#667eea">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="images/icons/icon-192x192.png">
<link rel="stylesheet" href="css/battle.css?v=1783932440567">
<style>
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 10000;
}

.modal-content {
    background: #1c1e22;
    padding: 20px;
    border-radius: 10px;
    max-width: 400px;
    text-align: center;
    border: 2px solid #3498db;
}

.modal-content h2 {
    color: #3498db;
    margin-bottom: 15px;
}

.modal-content p {
    color: #ecf0f1;
    margin-bottom: 20px;
}

.button-group {
    display: flex;
    gap: 10px;
    justify-content: center;
}

.button-group .btn {
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
}

.button-group .btn-primary {
    background: #3498db;
    color: white;
}

.button-group .btn {
    background: #7f8c8d;
    color: white;
}
</style>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js', { scope: '/' })
      .then(registration => console.log('ServiceWorker registered'))
      .catch(error => console.log('ServiceWorker registration failed'));
  });
}
</script>
</head>
<body>
<div class="battle-container">
<header class="battle-header"><h1>&#12496;&#12488;&#12523;</h1><p id="turnText" class="turn-text"></p></header>
<div class="players">
<div class="card player-card" id="playerCard"><p class="card-label">&#12354;&#12394;&#12383;</p><h2 id="myName">----</h2>
<div id="myDamage" class="damage"></div><div class="hpbar"><div id="myHPBar" class="fill"></div></div>
<p id="myHPText" class="hp-text">HP 100 / 100</p>
<div class="gauge-container">
    <div class="ultimate-gauge"><p class="ultimate-label">必殺技ゲージ</p><div class="ultimate-bar"><div id="myUltimateBar" class="ultimate-fill"></div></div><p id="myUltimateText" class="ultimate-text">0 / 100</p></div>
</div>
<div class="stats"><p id="myAtk">&#25915;&#25731;&#65306;-</p><p id="myDef">&#38450;&#24481;&#65306;-</p><p id="mySpeed">&#36895;&#12373;&#65306;-</p><p id="myGrade">&#23398;&#24180;&#65306;-</p></div></div>
<div class="vs">VS</div>
<div class="card enemy-card" id="enemyCard"><p class="card-label">&#30456;&#25163;</p><h2 id="enemyName">&#35501;&#36796;&#20013;...</h2>
<div id="enemyDamage" class="damage"></div><div class="hpbar"><div id="enemyHPBar" class="fill enemy"></div></div>
<p id="enemyHPText" class="hp-text">HP ???</p>
<div class="ultimate-gauge"><p class="ultimate-label">必殺技ゲージ</p><div class="ultimate-bar"><div id="enemyUltimateBar" class="ultimate-fill enemy"></div></div><p id="enemyUltimateText" class="ultimate-text">? / 100</p></div>
<div class="stats"><p id="enemyAtk">&#25915;&#25731;&#65306;&#65311;</p><p id="enemyDef">&#38450;&#24481;&#65306;&#65311;</p><p id="enemySpeed">&#36895;&#12373;&#65306;&#65311;</p><p id="enemyGrade">&#23398;&#24180;&#65306;&#65311;</p></div></div></div>
<div class="question-section">
<h2 id="questionTitle">&#21839;&#38988;</h2>
<div id="questionDisplay" class="question-display">&#35501;&#36796;&#20013;...</div>
<div class="answer-section">
<div id="choicesContainer" class="choices-container"></div>
</div>
<div id="timer" class="timer">00:00</div>
</div>
<div class="skills-section">
    <h3>アクティブスキル</h3>
    <div id="skillSlotsContainer" class="skill-slots"></div>
</div>
<div id="log" class="battle-log">&#25126;&#38360;&#38283;&#22987;&#65281;</div>
<div id="correctEffect" class="correct-effect">&#27491;&#35299;&#65281;&#65281;</div>
<div id="ultimateEffect" class="ultimate-effect">
    <div class="ultimate-text">必殺技発動！</div>
    <div class="ultimate-particles"></div>
</div>

<!-- PWA Install Prompt -->
<div id="install-popup" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <h2>アプリとしてインストール</h2>
        <p>このアプリをホーム画面に追加して、より快適に利用しませんか？</p>
        <div class="button-group">
            <button id="install-btn" class="btn btn-primary">インストール</button>
            <button id="dismiss-install-btn" class="btn">後で</button>
        </div>
    </div>
</div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="js/i18n.js?v=1783932440584"></script>
<script src="js/stats.js?v=1783932440584"></script>
<script src="js/weapons.js?v=1783932440584"></script>
<script src="js/skillTree.js?v=1783932440584"></script>
<script src="js/battle.js?v=1783932440584"></script>
<script>
// PWA Install Prompt Logic for Battle Page
let deferredPrompt;

window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    
    const installPopup = document.getElementById('install-popup');
    if (installPopup) {
        // 既にインストール済みかチェック
        if (window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: fullscreen)').matches || window.matchMedia('(display-mode: minimal-ui)').matches || navigator.standalone) {
            console.log('App is already installed.');
            return;
        }
        console.log('`beforeinstallprompt` event was fired on battle page.');
        installPopup.style.display = 'flex';
    }
});

window.addEventListener('appinstalled', () => {
    deferredPrompt = null;
    console.log('App was installed.');
});

// Install button click handler
const installBtn = document.getElementById('install-btn');
if (installBtn) {
    installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            console.log(`User response to the install prompt: ${outcome}`);
            deferredPrompt = null;
        }
        const installPopup = document.getElementById('install-popup');
        if (installPopup) {
            installPopup.style.display = 'none';
        }
    });
}

// Dismiss button click handler
const dismissInstallBtn = document.getElementById('dismiss-install-btn');
if (dismissInstallBtn) {
    dismissInstallBtn.addEventListener('click', () => {
        const installPopup = document.getElementById('install-popup');
        if (installPopup) {
            installPopup.style.display = 'none';
        }
    });
}
</script>
</body>
</html>
