<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>School Battle - アクションバトル</title>
<link rel="stylesheet" href="css/ui-settings.css">
<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: #0f1115; color: #eee; font-family: "Hiragino Sans", "Meiryo", sans-serif; overflow: hidden; touch-action: none; user-select: none; }
    .wrap { display: flex; flex-direction: column; height: 100%; max-width: 1100px; margin: 0 auto; padding: 6px; gap: 6px; }
    .stage { position: relative; flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; }
    #game { width: 100%; max-height: 100%; aspect-ratio: 16 / 9; flex: 0 0 auto; background: #1b2233; border-radius: 10px; border: 2px solid #2b3550; touch-action: none; }
    .intro { position: absolute; top: 44%; left: 50%; transform: translate(-50%, -50%); font-size: 1.4rem; font-weight: bold; background: rgba(0,0,0,0.6); padding: 10px 22px; border-radius: 10px; transition: opacity .6s; pointer-events: none; text-align: center; }
    .intro.hide { opacity: 0; }
    .end-overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; font-size: 3rem; font-weight: bold; background: rgba(0,0,0,0.55); border-radius: 10px; }
    .end-overlay.show { display: flex; }
    .end-overlay.win { color: #ffe08a; }
    .end-overlay.lose { color: #ff7b7b; }
    .panel { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: stretch; }
    .quiz { background: #171b26; border: 1px solid #2b3550; border-radius: 10px; padding: 8px 10px; min-width: 0; }
    .quiz-head { display: flex; justify-content: space-between; font-size: 0.75rem; color: #9fb3d9; }
    .quiz-q { font-size: 1.05rem; font-weight: bold; margin: 4px 0 6px; min-height: 1.4em; word-break: break-all; }
    .quiz-choices { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .quiz-choice { background: #263049; color: #fff; border: 1px solid #3a4870; border-radius: 8px; padding: 9px 4px; font-size: 0.95rem; cursor: pointer; word-break: break-all; }
    .quiz-choice:active { background: #34426a; }
    .quiz-choice.correct { background: #1f7a3d; border-color: #43d675; }
    .quiz-choice.wrong { background: #8a2b2b; border-color: #ff6b6b; }
    .side { display: flex; flex-direction: column; gap: 6px; min-width: 210px; }
    .energy { position: relative; height: 16px; background: #10131b; border: 1px solid #2b3550; border-radius: 8px; overflow: hidden; }
    .energy.flash { animation: eflash .3s; }
    @keyframes eflash { 50% { background: #5a1f1f; } }
    #energyFill { height: 100%; width: 0; background: linear-gradient(90deg, #2196f3, #64d8ff); transition: width .2s; }
    #energyText { position: absolute; inset: 0; text-align: center; font-size: 0.7rem; line-height: 16px; }
    .stamina { position: relative; height: 12px; background: #10131b; border: 1px solid #2b3550; border-radius: 6px; overflow: hidden; }
    .stamina.flash { animation: eflash .3s; }
    .stamina.guarding { border-color: #9df0ff; box-shadow: 0 0 6px rgba(157,240,255,.6); }
    #staminaFill { height: 100%; width: 100%; background: linear-gradient(90deg, #ffb347, #ffe08a); transition: width .15s; }
    #staminaText { position: absolute; inset: 0; text-align: center; font-size: 0.6rem; line-height: 12px; color: #2a2010; }
    .skill-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    .skill-btn { position: relative; background: #1c2233; color: #aab; border: 1px solid #333c58; border-radius: 8px; padding: 4px 2px 3px; font-size: 0.65rem; display: flex; flex-direction: column; align-items: center; gap: 1px; cursor: pointer; min-height: 62px; }
    .skill-btn.ready { background: #1d4f73; color: #fff; border-color: #64d8ff; box-shadow: 0 0 8px rgba(100,216,255,.5); }
    .skill-btn.empty { opacity: .45; cursor: default; }
    .sk-key { position: absolute; top: 1px; left: 4px; font-size: 0.6rem; color: #9fb3d9; }
    .sk-icon { font-size: 1.2rem; }
    .sk-name { font-size: 0.6rem; line-height: 1.1; text-align: center; }
    .sk-cost { color: #64d8ff; font-weight: bold; }
    .sk-cd { position: absolute; top: 1px; right: 4px; font-size: 0.6rem; color: #ffd54a; }
    .hint { font-size: 0.62rem; color: #7f8bab; text-align: center; }
    /* ---------- タッチ操作（スマホ・タブレット） ----------
       操作ボタン・スキル・クイズは画面に固定表示（position: fixed）にし、
       表示/非表示・サイズ・濃さは ⚙️ UI設定 から変えられる */
    .touch { display: none; }
    html.touch-ui .touch { display: block; }
    .touch-btn { position: fixed; z-index: 12; border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); background: rgba(255,80,80,0.38); color: #fff; font-weight: bold; touch-action: none; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    #attackBtn { right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); width: 84px; height: 84px; font-size: 1rem; }
    #dodgeBtn { right: calc(max(16px, env(safe-area-inset-right, 0px)) + 94px); bottom: max(16px, env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; font-size: 0.7rem; background: rgba(80,160,255,0.38); }
    #guardBtn { right: calc(max(16px, env(safe-area-inset-right, 0px)) + 160px); bottom: max(16px, env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; font-size: 0.7rem; background: rgba(157,240,255,0.32); }

    html.touch-ui .hint { display: none; }
    html.touch-ui .skill-bar { position: fixed; z-index: 12; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(max(16px, env(safe-area-inset-bottom, 0px)) + 94px); width: 232px; }
    html.touch-ui .skill-btn { min-height: 54px; background: rgba(28,34,51,0.85); }

    /* 横向き：画面全体をバトル画面にして、ゲージとクイズは下の中央に重ねる
       （上部は戦闘画面のHPバーがあるので空けておく。左はジョイスティック、右は操作ボタンの場所） */
    @media (orientation: landscape) {
        html.touch-ui .wrap { max-width: none; padding: 0; gap: 0; }
        html.touch-ui .stage { position: fixed; inset: 0; z-index: 1; }
        html.touch-ui #game { border-radius: 0; border: none; }
        html.touch-ui .panel { position: fixed; z-index: 12; display: flex; flex-direction: column-reverse; gap: 4px; left: calc(max(10px, env(safe-area-inset-left, 0px)) + 150px); right: calc(max(16px, env(safe-area-inset-right, 0px)) + 240px); bottom: max(8px, env(safe-area-inset-bottom, 0px)); margin: 0 auto; max-width: 520px; pointer-events: none; }
        html.touch-ui .panel > * { pointer-events: auto; }
        html.touch-ui .side { position: static; min-width: 0; }
        html.touch-ui #gauges { display: flex; flex-direction: column; gap: 3px; opacity: 0.92; }
        html.touch-ui .energy { height: 13px; } html.touch-ui #energyText { line-height: 13px; font-size: 0.62rem; }
        html.touch-ui .stamina { height: 10px; } html.touch-ui #staminaText { line-height: 10px; font-size: 0.55rem; }
        html.touch-ui .quiz { background: rgba(23,27,38,0.88); padding: 5px 8px 6px; }
        html.touch-ui .quiz-q { font-size: 0.9rem; margin: 1px 0 4px; min-height: 0; }
        html.touch-ui .quiz-choice { padding: 7px 3px; font-size: 0.85rem; }
        .intro { top: 40%; }
    }
    @media (orientation: landscape) and (max-width: 740px) {
        html.touch-ui .quiz-choices { grid-template-columns: repeat(2, 1fr); }
    }
    /* 縦向き：上に戦闘画面（拡大して自キャラを追従）、その下にクイズ、一番下に操作エリア。
       操作エリア（スティック・攻撃・スキルボタン）の高さを先に確保し、残りにバトル画面とクイズを収める。
       （以前はクイズがスティックに重なって、画面の低い端末でスティックが隠れていた） */
    @media (orientation: portrait) {
        html.touch-ui .wrap { max-width: none; padding: max(0px, env(safe-area-inset-top, 0px)) 0 calc(172px + env(safe-area-inset-bottom, 0px)); gap: 6px; }
        html.touch-ui .stage { flex: 0 0 auto; display: block; }
        html.touch-ui #game { border-radius: 0; border-left: none; border-right: none; }
        html.touch-ui .panel { grid-template-columns: 1fr; gap: 4px; padding: 0 6px; flex: 0 0 auto; position: relative; z-index: 12; }
        html.touch-ui .side { min-width: 0; }
        html.touch-ui .quiz { padding: 6px 8px; }
        html.touch-ui .quiz-q { font-size: 0.95rem; margin: 2px 0 5px; min-height: 0; }
        html.touch-ui .quiz-choices { grid-template-columns: repeat(2, 1fr); gap: 6px; }
        html.touch-ui .quiz-choice { min-height: 46px; padding: 6px 4px; font-size: 1rem; touch-action: manipulation; }
        /* ゲージは1行に並べて高さを節約 */
        html.touch-ui #gauges { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        html.touch-ui .energy, html.touch-ui .stamina { height: 14px; }
        html.touch-ui #energyText, html.touch-ui #staminaText { line-height: 14px; font-size: 0.62rem; }
        /* スティック・ボタンはクイズより前面にならないよう、操作エリア内にだけ置く */
        html.touch-ui .skill-bar { width: min(232px, 56vw); gap: 4px; }
        html.touch-ui .skill-btn { min-height: 52px; }
    /* 縦向き：上に戦闘画面（拡大して自キャラを追従）、その下にクイズ、一番下に操作ボタン。
       クイズは操作ボタンの上（親指が届く位置）に置き、スティックの反応エリアは画面下側だけにしてある */
    @media (orientation: portrait) {
        html.touch-ui .wrap { max-width: none; padding: max(0px, env(safe-area-inset-top, 0px)) 0 0; gap: 6px; }
        html.touch-ui .stage { flex: 0 0 auto; display: block; }
        html.touch-ui #game { border-radius: 0; border-left: none; border-right: none; }
        html.touch-ui .panel { grid-template-columns: 1fr; gap: 6px; padding: 0 6px; position: relative; z-index: 12; }
        html.touch-ui .side { min-width: 0; }
        html.touch-ui .quiz { position: relative; z-index: 12; }
        html.touch-ui .quiz-choices { grid-template-columns: repeat(2, 1fr); gap: 8px; }
        html.touch-ui .quiz-choice { min-height: 56px; padding: 10px 4px; font-size: 1.05rem; touch-action: manipulation; }
        html.touch-ui #gauges { display: flex; flex-direction: column; gap: 4px; margin-bottom: 2px; }
    }
    @media (max-width: 640px) {
        .panel { grid-template-columns: 1fr; }
        .side { min-width: 0; }
        .quiz-choices { grid-template-columns: repeat(2, 1fr); }
    }
    }
</style>
</head>
<body>
<div class="wrap">
    <div class="stage">
        <canvas id="game"></canvas>
        <div id="enemyIntro" class="intro"></div>
        <div id="endOverlay" class="end-overlay"></div>
        <div class="touch">
            <button type="button" id="attackBtn" class="touch-btn">攻撃</button>
            <button type="button" id="dodgeBtn" class="touch-btn">回避</button>
            <button type="button" id="guardBtn" class="touch-btn">ガード</button>
        </div>
    </div>
    <div class="panel">
        <div class="quiz">
            <div class="quiz-head"><span id="quizSubject"></span><span id="quizStreak"></span></div>
            <div id="quizQuestion" class="quiz-q">読み込み中...</div>
            <div id="quizChoices" class="quiz-choices"></div>
        </div>
        <div class="side">
            <div id="gauges">
                <div class="energy"><div id="energyFill"></div><div id="energyText">0 / 100</div></div>
                <div class="stamina"><div id="staminaFill"></div><div id="staminaText">0 / 0</div></div>
            </div>
            <div id="skillBar" class="skill-bar"></div>
            <div class="hint">WASD移動 / マウス or Space 攻撃 / Shift or 右クリック 回避 / Ctrl長押し ガード / Z X C V スキル / 1-4 クイズ回答</div>
        </div>
    </div>
</div>
<script src="js/i18n.js"></script>
<script src="js/stats.js"></script>
<script src="js/weapons.js"></script>
<script src="js/materials.js"></script>
<script src="js/monsters.js"></script>
<script src="js/questions.js"></script>
<script src="js/action-skills.js"></script>
<script src="js/ui-settings.js"></script>
<script src="js/joystick.js"></script>
<script src="js/action-battle.js"></script>
</body>
</html>
