<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>School Battle</title>
<link rel="stylesheet" href="css/style.css?v=1783932440582">
</head>
<body>
<div id="app" class="container">
<header class="page-header">
    <h1>School Battle</h1>
    <p class="subtitle" id="subtitle">持ち点を振り分けて戦うオンライン対戦</p>
</header>

<section class="section">
    <label class="field-label" for="playerName" id="playerNameLabel">プレイヤー名</label>
    <input id="playerName" type="text" placeholder="名前を入力" autocomplete="nickname">
</section>

<section class="section">
    <h2 id="statAllocationTitle">ステータス配分</h2>
    <p class="stat-allocation-desc" id="statAllocationDesc">持ち点200ポイントを自由に振り分けてください。</p>
    <p id="remainingPoints" class="remaining-points">残り持ち点：200 / 200</p>

    <div class="stat-allocation">
        <label>学年
            <select id="statGrade">
                <option value="1">小学校1年生</option>
                <option value="2">小学校2年生</option>
                <option value="3">小学校3年生</option>
                <option value="4">小学校4年生</option>
                <option value="5">小学校5年生</option>
                <option value="6">小学校6年生</option>
                <option value="7">中学校1年生</option>
                <option value="8">中学校2年生</option>
                <option value="9">中学校3年生</option>
                <option value="10">高校1年生</option>
                <option value="11">高校2年生</option>
                <option value="12">高校3年生</option>
            </select>
        </label>

        <label>HP
            <input id="statMaxHp" type="number" value="50" min="10" max="280">
        </label>

        <label id="atkLabel">
            <span id="atkLabelText">攻撃</span>
            <input id="statAtk" type="number" value="70" min="10" max="280">
        </label>

        <label id="defLabel">
            <span id="defLabelText">防御</span>
            <input id="statDef" type="number" value="50" min="10" max="280">
        </label>

        <label id="speedLabel">
            <span id="speedLabelText">速さ</span>
            <input id="statSpeed" type="number" value="30" min="10" max="280">
        </label>
    </div>

    <button type="button" class="btn btn-primary" id="createCharBtn" onclick="createCharacter()">キャラクター作成</button>
</section>

<section class="study-section section">
    <h2 id="studyTimerTitle">勉強タイマー</h2>

    <p class="study-desc" id="studyDesc">勉強時間が長いほど経験値が増えます。1分ごとに選んだステータスが1ポイント上昇します。</p>

    <label class="field-label" for="studyFocus" id="studyFocusLabel">強化するステータス</label>

    <select id="studyFocus">
        <option value="jp" id="jpOpt">国語（HP・防御）</option>
        <option value="math" id="mathOpt">数学（攻撃・速さ）</option>
        <option value="eng" id="engOpt">英語（特殊・速さ）</option>
        <option value="sci" id="sciOpt">理科（攻撃・特殊）</option>
        <option value="soc" id="socOpt">社会（HP・防御）</option>
    </select>

    <div id="studyTimer" class="study-timer">00:00:00</div>

    <button type="button" class="btn" id="studyStart" onclick="startStudy()">勉強開始</button>
    <button type="button" class="btn" id="studyStop" onclick="stopStudy()" disabled>勉強終了</button>
</section>

<section id="status" class="status-section"></section>
<section id="xpDisplay" class="xp-section"></section>

<section class="online-section section">
    <h2 id="onlineTitle">オンライン対戦</h2>

    <button type="button" class="btn" id="randomMatch">ランダムマッチ</button>

    <button type="button" class="btn" id="botMatch">ボット対戦（練習用）</button>

    <p style="color: #ff6b6b; font-size: 0.9rem; margin-top: 10px;">
        ⚠️ ランダムマッチは混雑時には時間がかかる場合があります。<br>
        ボット対戦で練習することをお勧めします。
    </p>

    <button type="button" class="btn" id="createRoom" disabled style="opacity: 0.5; cursor: not-allowed;">ルーム作成（メンテナンス中）</button>

    <div id="joinSection" style="opacity: 0.5; pointer-events: none;">
        <label for="roomInput" id="roomCodeLabel">ルームコード</label>
        <input id="roomInput" type="text" placeholder="6桁のコード" maxlength="6" disabled>
        <button type="button" class="btn" id="joinRoom" disabled>ルーム参加（メンテナンス中）</button>
    </div>
</section>

<section id="playerDataSection" class="player-data-section">
    <button type="button" class="btn btn-danger" id="deletePlayerBtn" onclick="deletePlayer()">プレイヤー削除</button>
</section>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="js/i18n.js?v=1783932440582"></script>
<script src="js/stats.js?v=1783932440582"></script>
<script src="js/script.js?v=1783932440582"></script>
<script src="js/online.js?v=1783932440582"></script>
</body>
</html>
