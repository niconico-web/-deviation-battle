<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>学習支援ツール - 実践フィールド</title>
<meta name="description" content="学習支援ツール - 実践フィールド">
<link rel="stylesheet" href="css/survival.css">
<style>

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: #0b0d12; color: #eee; font-family: "Hiragino Sans", "Meiryo", sans-serif; overflow: hidden; touch-action: none; user-select: none; }
    #svCanvas { position: fixed; inset: 0; display: block; touch-action: none; }
    .hud { position: fixed; z-index: 5; pointer-events: none; }
    #top { top: max(8px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left)); width: min(320px, 46vw); }
    .bar { position: relative; height: 16px; background: rgba(0,0,0,.6); border: 1px solid #333; border-radius: 8px; overflow: hidden; margin-bottom: 4px; }
    .bar > div.fill { height: 100%; width: 100%; }
    .bar > span { position: absolute; inset: 0; text-align: center; font-size: .68rem; line-height: 16px; text-shadow: 0 0 3px #000; }
    #hpFill { background: linear-gradient(90deg, #d33, #f77); }
    #enFill { background: linear-gradient(90deg, #2196f3, #64d8ff); width: 0; }
    #progFill { background: linear-gradient(90deg, #c9a227, #ffe08a); width: 0; }
    #info { font-size: .8rem; text-shadow: 0 0 3px #000; display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
    #challengeBar { position: fixed; top: max(8px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); width: min(420px, 40vw); display: none; z-index: 5; pointer-events: none; text-align: center; }
    #challengeName { font-size: .85rem; font-weight: bold; text-shadow: 0 0 4px #000; }
    #challengeFill { height: 100%; background: linear-gradient(90deg, #8a1f9a, #ff5a8a); width: 100%; }
    #announce { position: fixed; top: 22%; left: 50%; transform: translate(-50%, 0); font-size: 1.4rem; font-weight: bold; background: rgba(0,0,0,.65); padding: 10px 22px; border-radius: 10px; opacity: 0; transition: opacity .4s; pointer-events: none; text-align: center; z-index: 6; max-width: 90vw; }
    #announce.show { opacity: 1; }
    #lootLog { position: fixed; left: max(10px, env(safe-area-inset-left)); top: 120px; font-size: .78rem; text-shadow: 0 0 3px #000; pointer-events: none; z-index: 5; }
    #quiz { position: fixed; z-index: 7; left: 50%; transform: translateX(-50%); bottom: max(8px, env(safe-area-inset-bottom)); width: min(560px, 54vw); background: rgba(20,24,36,.88); border: 1px solid #2b3550; border-radius: 10px; padding: 6px 8px; }
    #quizQ { font-size: .95rem; font-weight: bold; margin: 2px 0 5px; word-break: break-all; }
    #quizC { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    #quizC button { background: #263049; color: #fff; border: 1px solid #3a4870; border-radius: 8px; padding: 8px 3px; font-size: .88rem; cursor: pointer; word-break: break-all; touch-action: manipulation; }
    #quizC button.ok { background: #1f7a45; border-color: #3ddc84; }
    #quizC button.ng { background: #7a2020; border-color: #ff6a6a; }
    #quizToggle { position: fixed; z-index: 8; right: max(10px, env(safe-area-inset-right)); top: calc(max(8px, env(safe-area-inset-top)) + 4px); background: rgba(0,0,0,.55); color: #fff; border: 1px solid #444; border-radius: 8px; padding: 5px 9px; font-size: .75rem; }
    .touch-btn { position: fixed; z-index: 9; border-radius: 50%; border: 2px solid rgba(255,255,255,.55); background: rgba(80,160,255,.35); color: #fff; display: none; font-size: .8rem; touch-action: none; }
    html.touch .touch-btn { display: block; }
    #btnDash { right: max(16px, env(safe-area-inset-right)); bottom: 120px; width: 62px; height: 62px; }
    #btnGuard { right: max(88px, env(safe-area-inset-right)); bottom: 120px; width: 62px; height: 62px; background: rgba(60,200,230,.35); }
    #btnUlt { right: max(160px, env(safe-area-inset-right)); bottom: 120px; width: 62px; height: 62px; background: rgba(255,200,40,.35); }
    @keyframes pulse { to { transform: scale(1.1); } }
    #skillBar { position: fixed; z-index: 9; right: max(12px, env(safe-area-inset-right)); bottom: max(8px, env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(4, 58px); gap: 6px; }
    .skill-btn { position: relative; height: 66px; background: rgba(28,34,51,.88); color: #fff; border: 2px solid #3a4870; border-radius: 10px; padding: 2px; font-size: .62rem; display: flex; flex-direction: column; align-items: center; justify-content: center; touch-action: none; cursor: pointer; overflow: hidden; }
    .skill-btn.ready { border-color: #9df0ff; box-shadow: 0 0 8px rgba(120,220,255,.7); }
    .skill-btn.short { opacity: .6; }
    .skill-btn.empty { opacity: .35; cursor: default; }
    .sk-key { position: absolute; top: 1px; left: 4px; font-size: .6rem; color: #9fb3d9; }
    .sk-icon { font-size: 1.3rem; line-height: 1.1; }
    .sk-name { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: .58rem; }
    .sk-cost { color: #7fe3ff; font-size: .6rem; }
    .sk-cd { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 1rem; font-weight: bold; background: rgba(0,0,0,.35); pointer-events: none; }
    .sk-cd:empty { display: none; }
    .bar.flash { outline: 2px solid #ff6a6a; }
    #quiz { width: min(560px, calc(100vw - 560px)); min-width: 300px; }
    /* ---- スマホ横画面などの低い画面：HUDを詰めて、問題・特技・ボタンが重ならないようにする ---- */
    @media (max-height: 520px) {
        #top { top: max(4px, env(safe-area-inset-top)); width: min(250px, 36vw); }
        #info { font-size: .66rem; gap: 6px; margin-bottom: 2px; }
        .bar { height: 12px; margin-bottom: 2px; border-radius: 6px; }
        .bar > span { font-size: .56rem; line-height: 12px; }
        #lootLog { display: none; }
        #challengeBar { left: calc(36vw + 24px); transform: none; width: calc(100vw - 36vw - 24px - 140px); top: max(4px, env(safe-area-inset-top)); }
        #challengeName { font-size: .7rem; }
        #announce { font-size: 1rem; padding: 6px 14px; top: 14%; }
        #quizToggle { padding: 3px 7px; font-size: .66rem; top: max(4px, env(safe-area-inset-top)); }
        html #quiz { width: min(480px, 44vw); min-width: 0; padding: 4px 6px; bottom: max(4px, env(safe-area-inset-bottom)); }
        html #quizQ { font-size: .76rem; margin: 0 0 3px; max-height: 3.3em; overflow: hidden; }
        html #quizC { grid-template-columns: repeat(4, 1fr); gap: 4px; }
        html #quizC button { padding: 6px 2px; font-size: .76rem; }
        html.touch #skillBar { grid-template-columns: repeat(2, 54px); gap: 5px; right: max(8px, env(safe-area-inset-right)); bottom: max(4px, env(safe-area-inset-bottom)); }
        html.touch .skill-btn { height: 52px; }
        html.touch .sk-name { font-size: .5rem; }
        html.touch #btnDash { width: 52px; height: 52px; right: max(12px, env(safe-area-inset-right)); bottom: calc(max(4px, env(safe-area-inset-bottom)) + 120px); }
        html.touch #btnGuard { width: 52px; height: 52px; right: max(70px, env(safe-area-inset-right)); bottom: calc(max(4px, env(safe-area-inset-bottom)) + 120px); }
        html.touch #btnUlt { width: 52px; height: 52px; right: max(128px, env(safe-area-inset-right)); bottom: calc(max(4px, env(safe-area-inset-bottom)) + 120px); }
        .panel { padding: 10px 14px; max-height: 94vh; }
        .panel h2 { font-size: 1.05rem; margin: 0 0 4px; }
        .panel button { padding: 7px 14px; font-size: .9rem; margin-top: 6px; }
        #resBody { font-size: .8rem; margin-top: 4px; }
    }
    /* 画面が狭いスマホ横（〜700px）：問題をさらに細く */
    @media (max-height: 520px) and (max-width: 700px) { html #quiz { width: min(400px, 42vw); } }
    .overlay { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: rgba(5,7,12,.82); }
    .panel { background: #171b26; border: 2px solid #2b3550; border-radius: 14px; padding: 18px 22px; width: min(480px, 92vw); max-height: 90vh; overflow: auto; text-align: center; }
    .panel h2 { margin: 0 0 6px; } .panel .code { color: #9fb3d9; font-size: .85rem; margin-bottom: 8px; }
    .mem { background: #232a3d; border-radius: 8px; padding: 7px 10px; margin: 5px 0; text-align: left; }
    .mem small { color: #9fb3d9; }
    .panel button { background: #3a6ee8; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font-size: 1rem; margin: 8px 5px 0; cursor: pointer; }
    .panel button.sub { background: #44495a; }
    #waitMsg { font-size: .85rem; color: #b8c4e0; margin-top: 8px; }
    #resBody { text-align: left; margin-top: 10px; font-size: .92rem; } #resBody h4 { margin: 10px 0 4px; }
    .lw { padding: 3px 0; font-weight: bold; } .lw small { color: #aab; font-weight: normal; }
    .hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(max(8px, env(safe-area-inset-bottom)) + 108px); font-size: .7rem; color: #aab; text-shadow: 0 0 3px #000; z-index: 4; pointer-events: none; }
    html.touch .hint { display: none; }

/* ---- サバイバル用の追加（ステージと同じ見た目の部品） ---- */
#svCorner{position:fixed;left:max(10px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));z-index:7;display:flex;gap:6px}
#svCorner button{padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.4);background:rgba(20,15,40,.75);color:#fff;font-size:.8rem;cursor:pointer}
html.touch #svCorner button{padding:6px 9px;font-size:.7rem}
#btnArt{right:max(186px,env(safe-area-inset-right));bottom:120px;width:62px;height:62px;background:rgba(170,60,200,.4);display:none}
html.touch #btnArt{width:52px;height:52px;right:max(186px,env(safe-area-inset-right));bottom:calc(max(4px,env(safe-area-inset-bottom)) + 120px)}
#btnUse{right:max(16px,env(safe-area-inset-right));bottom:190px;width:62px;height:62px;background:rgba(90,200,120,.4);display:none}
html.touch #btnUse{width:52px;height:52px;right:max(12px,env(safe-area-inset-right));bottom:calc(max(4px,env(safe-area-inset-bottom)) + 184px)}
#svBoot{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#0b0714;color:#cfd6ff;font-size:1.1rem}
#svPrep{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:60;padding:8px}
#svPrep .pp{width:min(560px,96%);max-height:94%;overflow-y:auto;background:#161a2eef;border:1px solid #6a5acd;border-radius:14px;padding:10px 14px;color:#fff;font-size:.85rem}
#svPrep h3{margin:0 0 8px}#svPrep .pc{border:1px solid #fff2;border-radius:10px;padding:8px;margin-bottom:8px;display:flex;flex-direction:column;gap:3px;background:#0004}
#svPrep select{padding:6px;border-radius:6px;background:#0008;color:#fff;border:1px solid #fff4}
#svPrep small{color:#bbb}.pe{color:#bbb;font-size:.78rem}.pg{display:block}.ps{padding:1px 0}
#svPrep .pb{display:flex;gap:8px}#svPrep .pb button{flex:1;padding:10px;border-radius:10px;border:0;font:inherit;font-weight:700;cursor:pointer;background:#b8860b;color:#fff}#svPrep .pb button#svpNo{background:#444}
#nbOverlay{position:fixed !important;z-index:70 !important}
.nb-res{min-height:1.6em;margin:6px 0;padding:6px;border-radius:8px;background:#0006;text-align:center}

</style>
</head>
<body>
<canvas id="svCanvas"></canvas>

<div id="top" class="hud">
    <div id="info"><span id="stageName"></span><span id="wpnName"></span><span id="timer">⏱ 0:00</span></div>
    <div class="bar"><div id="hpFill" class="fill"></div><span id="hpText"></span></div>
    <div class="bar" id="enBar"><div id="enFill" class="fill"></div><span id="enText">精神力 0</span></div>
    <div class="bar"><div id="progFill" class="fill"></div><span id="prog">解答 0 / 0</span></div>
</div>
<div id="challengeBar"><div id="challengeName"></div><div class="bar"><div id="challengeFill" class="fill"></div></div></div>
<div id="announce"></div>
<div id="lootLog"></div>
<div class="hint">WASD移動 / マウス or Space 回答 / Shift or 右クリック スキップ / Z X C V 特技 / 1〜4 問題 / Tab 問題表示切替</div>

<button type="button" id="quizToggle">問題 ▢</button>
<div id="quiz"><div id="quizQ">読み込み中...</div><div id="quizC"></div></div>
<button type="button" id="btnDash" class="touch-btn">スキップ</button>
<button type="button" id="btnGuard" class="touch-btn">🛡 集中</button>
<button type="button" id="btnUlt" class="touch-btn">⚡0%</button>
<div id="skillBar"></div>

<div id="svCorner"><button type="button" id="svBtnTown">🏠 町へ戻る</button><button type="button" id="svBtnNation">🏰 国</button><button type="button" id="svBtnShop">🏪 店</button></div>
<button type="button" id="btnArt" class="touch-btn">神器</button>
<button type="button" id="btnUse" class="touch-btn">使う</button>
<div id="svBoot">⏳ 実践フィールドに接続中…</div>

<script src="/socket.io/socket.io.js"></script>
<script src="js/orientation.js"></script>
<script src="js/i18n.js"></script>
<script src="js/stats.js"></script>
<script src="js/tools.js"></script>
<script src="js/materials.js"></script>
<script src="js/questions.js"></script>
<script src="js/action-skills.js"></script>
<script src="js/hw-weapons.js"></script>
<script src="js/elements.js"></script>
<script src="js/armor.js"></script>
<script src="js/accessories.js"></script>
<script src="js/pixel-data.js"></script>
<script src="js/pixel.js"></script>
<script src="js/pixel-extra.js"></script>
<script src="js/market.js"></script>
<script src="js/survival-world.js"></script>
<script src="js/survival-pixel.js"></script>
<script src="js/survival-hud.js"></script>
<script src="js/survival.js"></script>
<script src="js/nation-ui.js"></script>
<script>
window.socket = io({ reconnection: true, reconnectionDelay: 1000, reconnectionDelayMax: 5000, reconnectionAttempts: 10, transports: ['websocket', 'polling'], forceNew: false });
if (window.SBOrientation) { try { SBOrientation.guard(); } catch (e) { /* なし */ } }
function svBoot() {
    const boot = document.getElementById('svBoot');
    let p = null; try { p = JSON.parse(localStorage.getItem('player') || 'null'); } catch (e) { /* なし */ }
    if (!p || !p.id) { boot.textContent = 'キャラクターが見つかりません。町から入り直してください'; setTimeout(() => { location.href = 'index.html'; }, 2500); return; }
    let ok = false; try { ok = !!(window.HW && HW.load().world2); } catch (e) { /* 開いていない */ }
    if (!ok) { boot.textContent = '次元の裂け目は、第二世界に到達すると開きます'; setTimeout(() => { location.href = 'index.html'; }, 2500); return; }
    const go = () => { boot.style.display = 'none'; if (window.SBSurvival && SBSurvival.begin) SBSurvival.begin(); };
    if (window.socket.connected) go(); else { window.socket.once('connect', go); setTimeout(() => { if (boot.style.display !== 'none') go(); }, 6000); }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', svBoot); else svBoot();
</script>
</body>
</html>
