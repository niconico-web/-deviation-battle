<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>学習練習</title>
<meta name="description" content="学習用練習問題">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0d12; }
    #frame { width: 100%; height: 100%; border: none; }
    #loading { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-family: sans-serif; }
</style>
</head>
<body>
<div id="loading">読み込み中...</div>
<iframe id="frame" src="about:blank"></iframe>
<script>
    const frame = document.getElementById('frame');
    const loading = document.getElementById('loading');

    // クエリパラメータを取得
    const params = new URLSearchParams(window.location.search);
    const stageId = params.get('stage') || 'stage1';

    // 動的にiframeの内容を生成
    frame.srcdoc = `
        <!DOCTYPE html>
        <html lang="ja">
        <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
        <title>学習練習</title>
        <style>
            * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
            html, body { margin: 0; height: 100%; background: #0b0d12; color: #eee; font-family: "Hiragino Sans", "Meiryo", sans-serif; overflow: hidden; touch-action: none; user-select: none; }
            #practiceCanvas { position: fixed; inset: 0; display: block; touch-action: none; }
        </style>
        </head>
        <body>
        <canvas id="practiceCanvas"></canvas>
        <script src="/socket.io/socket.io.js"><\/script>
        <script src="js/orientation.js"><\/script>
        <script src="js/i18n.js"><\/script>
        <script src="js/stats.js"><\/script>
        <script src="js/tools.js"><\/script>
        <script src="js/materials.js"><\/script>
        <script src="js/questions.js"><\/script>
        <script src="js/questions-expanded.js"><\/script>
        <script src="js/review-system.js"><\/script>
        <script src="js/study-manager.js"><\/script>
        <script src="js/action-skills.js"><\/script>
        <script src="js/hw-weapons.js"><\/script>
        <script src="js/elements.js"><\/script>
        <script src="js/armor.js"><\/script>
        <script src="js/accessories.js"><\/script>
        <script src="js/achievements.js"><\/script>
        <script src="js/pixel-data.js"><\/script>
        <script src="js/pixel.js"><\/script>
        <script src="js/pixel-extra.js"><\/script>
        <script src="js/stage-data.js"><\/script>
        <script src="js/season.js"><\/script>
        <script src="js/pvp-event.js"><\/script>
        <script src="js/boss-moves.js"><\/script>
        <script src="js/debug.js"><\/script>
        <script src="js/practice.js"><\/script>
        <script>
            // ロード完了を親に通知
            window.parent.postMessage({ type: 'loaded' }, '*');
        <\/script>
        </body>
        </html>
    `;

    frame.onload = () => {
        loading.style.display = 'none';
    };

    // エラーハンドリング
    window.addEventListener('message', (e) => {
        if (e.data.type === 'loaded') {
            loading.style.display = 'none';
        }
    });
</script>
</body>
</html>
