services:
  - type: web
    name: schoolbattle
    env: node
    buildCommand: npm install && cd server && npm install
    startCommand: node index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      # AIスキル作成用（Anthropic APIキー）。未設定でも動くが、キーワード判定の簡易版になる
      - key: ANTHROPIC_API_KEY
        sync: false
      # Supabase（保存データの永続化）。server/supabase/schema.sql を Supabase の SQL Editor で実行してから、
      # Project Settings → API の「Project URL」と「service_role」キーを入れる。service_role は絶対に公開しないこと
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # 任意：1人が1日にAIで作れる回数（既定30）・使うモデル（既定 claude-haiku-5-5）
      # - key: SKILL_AI_DAILY_LIMIT
      #   value: "30"
    # 【重要】現在 plan: free のため永続ディスクは使えず、サーバーが
    # 再起動されるたびに server/data/ 以下（ギルド・プレイヤーデータ等）が
    # 消えてしまいます（「ギルドがしばらくすると消える」不具合の原因）。
    # 有料プラン（例: starter）にアップグレードした上で、下記の disk 設定の
    # コメントを外すとデータが永続化されます。
    # disk:
    #   name: schoolbattle-data
    #   mountPath: /opt/render/project/src/server/data
    #   sizeGB: 1
